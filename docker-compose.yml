services:
  # ── Bot Nominasi & Re-Nominasi (Backend + Dashboard Web) ──
  bot:
    build: .
    container_name: bot-nominasi-renominasi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    volumes:
      - ./logs:/app/logs
