services:
  # ── Bot Nominasi & Re-Nominasi (Backend + Dashboard Web) ──
  bot:
    build: .
    container_name: bot-nominasi-renominasi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3118}
    ports:
      - "${PORT:-3118}:${PORT:-3118}"
    volumes:
      - ./logs:/app/logs
